name:  Build and push Docker image
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-docker.yaml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      
jobs:
  publish_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run:  docker build . -t ghcr.io/headluck/headluck-portfolio:latest
      
      - name: push image 
        run: |
          docker login ghcr.io -u headluck -p ${{ secrets.DOCKER_USER_TOKEN }}
          docker push ghcr.io/headluck/headluck-portfolio:latest
      